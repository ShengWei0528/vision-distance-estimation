<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Pinhole camera: similar-triangles distance estimation</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="319" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- equation -->
  <text x="30" y="40" font-size="16" fill="#0f172a" font-weight="600">Similar triangles</text>
  <text x="30" y="64" font-size="15" fill="#334155">P / F = W / D&#160;&#160;&#160;⇒&#160;&#160;&#160;D = W · F / P</text>

  <!-- optical axis -->
  <line x1="90" y1="160" x2="720" y2="160" stroke="#cbd5e1" stroke-dasharray="6 5"/>

  <!-- rays through the pinhole -->
  <line x1="660" y1="80" x2="130" y2="180.95" stroke="#64748b" stroke-width="1.5"/>
  <line x1="660" y1="240" x2="130" y2="139.05" stroke="#64748b" stroke-width="1.5"/>

  <!-- image plane -->
  <line x1="130" y1="100" x2="130" y2="220" stroke="#94a3b8" stroke-width="3"/>
  <!-- projected image of the object -->
  <line x1="130" y1="139.05" x2="130" y2="180.95" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
  <text x="112" y="165" font-size="16" fill="#ea580c" text-anchor="end" font-weight="600">P</text>
  <text x="130" y="244" font-size="13" fill="#475569" text-anchor="middle">image plane</text>

  <!-- pinhole -->
  <circle cx="240" cy="160" r="5" fill="#0f172a"/>
  <text x="240" y="244" font-size="13" fill="#475569" text-anchor="middle">pinhole / lens</text>

  <!-- object -->
  <line x1="660" y1="80" x2="660" y2="240" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <text x="682" y="165" font-size="16" fill="#2563eb" font-weight="600">W</text>
  <text x="660" y="66" font-size="13" fill="#475569" text-anchor="middle">object (known width)</text>

  <!-- dimension F -->
  <line x1="130" y1="270" x2="240" y2="270" stroke="#334155" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="185" y="293" font-size="13" fill="#0f172a" text-anchor="middle">F  focal length (px)</text>

  <!-- dimension D -->
  <line x1="240" y1="270" x2="660" y2="270" stroke="#334155" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="450" y="293" font-size="13" fill="#0f172a" text-anchor="middle">D  distance to the object</text>

  <!-- legend -->
  <text x="300" y="36" font-size="12" fill="#475569">W: real width (cm), set by the user</text>
  <text x="300" y="54" font-size="12" fill="#475569">P: bounding-box width in the image (px)</text>
</svg>
